[project]
name = "backend"
version = "0.1.0"
description = "Astrolabe backend — personalized learning-path API (FastAPI + ML course matcher + Groq)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.135.3",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.12.5",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "langchain-groq>=0.2",
    "groq>=0.13",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]
